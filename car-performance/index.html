function scheduleInsightCard(){const {open,needed,warnings}=scheduleInsight();const rugby=plan().sessions.filter(s=>s.kind==='rugby');return `<div class="card"><div class="card-head"><h2>Intensidad y compatibilidad</h2>${badge('PDF + estimación','amber')}</div><p class="muted small">El color viene del entrenador. El esfuerzo y las UA son estimaciones independientes basadas en actividades y duraciones; no equivalen a una medida real.</p>${rugby.map(s=>`<div class="item-row"><div><strong>${esc(fDate(s.date,'long'))}</strong><div class="mt">${intensityInfo(s)}</div></div></div>`).join('')}<p class="muted small mt">Fechas sin sesión de equipo ni descanso explícito: <strong>${open.length?open.map(d=>fDate(d)).join(', '):'ninguna'}</strong>.</p><p class="muted small">El plan contiene <strong>${needed} sesiones de fuerza</strong>. ${open.length<needed?'Hay menos huecos libres que sesiones.':'Comprueba la carga antes de distribuir las sesiones.'}</p>${warnings.map(w=>`<div class="notice" style="margin-top:8px">${esc(w)}</div>`).join('')}<p class="fineprint">La estimación sirve para planificar, no diagnosticar fatiga ni establecer límites seguros individuales. Registra tu esfuerzo al terminar y consulta al preparador ante dudas.</p></div>`}

const hasMatch=(exercise,term)=>exercise.name.toLowerCase().includes(term.toLowerCase());
const volume=w=>w.sets.reduce((sum,s)=>sum+(Number(s.kg)||0)*(Number(s.reps)||0),0);
const infoRow=(label,val)=>`<div class="item-row"><span class="muted small">${esc(label)}</span><strong>${esc(val)}</strong></div>`;
const heading=(title,desc,action='')=>`<div class="page-header"><div><div class="eyebrow">CAR · RENDIMIENTO</div><h1>${esc(title)}</h1>${desc?`<p>${esc(desc)}</p>`:''}</div>${action}</div>`;
const badge=(label,style='')=>`<span class="tag ${style}">${esc(label)}</span>`;
const dates7=(start)=>Array.from({length:7},(_,i)=>plusDays(start,i));
function dayLabel(date){const s=sessionsOn(date),gym=assignedOn(date),done=doneOn(date);if(done.length)return ['Completado','gym'];if(s.find(x=>x.kind==='rugby'))return ['Rugby','rugby'];if(gym.length)return ['Gym','gym'];if(s.find(x=>x.kind==='match'))return ['Partido','rugby'];if(s.find(x=>x.kind==='rest'))return ['Descanso','rest'];return ['Sin sesión','empty']}
function dayTiles(){return `<div class="week-strip">${dates7(plan().start).map(date=>{const [txt,cl]=dayLabel(date),is=ui.selectedDate===date;return `<button class="day-tile ${is?'selected':''}" data-action="date" data-date="${date}" aria-label="${fDate(date,'long')}, ${txt}"><span class="dname">${shortDay[fromIso(date).getDay()]}</span><span class="dnum">${fromIso(date).getDate()}</span><span class="dstatus ${cl}">${txt}</span></button>`}).join('')}</div>`}
function sessionCard(s){const kind=s.kind==='rugby'?'rugby':s.kind==='match'?'rugby':'rest';const title=s.kind==='rugby'?'Entrenamiento de rugby':s.kind==='match'?'Partido':'Descanso de equipo';return `<div class="session"><div class="session-bar ${kind}"></div><div class="body"><strong>${title}</strong>${s.objective?`<p>${esc(s.objective)}</p>`:''}${s.activities?.length?`<div class="pill-list mt" style="margin-top:9px">${s.activities.map(a=>`<span>${esc(a.code)} · ${esc(a.name)}</span>`).join('')}</div>`:''}${intensityInfo(s,true)}</div><span class="time num">${esc(s.start||'')}${s.minutes?' · '+esc(s.minutes)+' min':''}</span></div>`}
function gymCard(d){return `<div class="session"><div class="session-bar"></div><div class="body"><strong>${esc(d.title)} · ${esc(d.subtitle)}</strong><p>Sesión asignada manualmente</p></div><button class="btn small" data-action="gym-day" data-id="${d.id}">Abrir</button></div>`}
function panelForDate(date){const ses=sessionsOn(date),gym=assignedOn(date),done=doneOn(date);return `<div class="card"><div class="card-head"><div><div class="eyebrow">${esc(fDate(date,'long'))}</div><h2>Actividad del día</h2></div>${badge((ses.length+gym.length)+' eventos','gray')}</div>${ses.map(s=>sessionCard(s)+(s.manual?`<div class="actions" style="margin-bottom:8px"><button class="btn small red" data-action="delete-manual-event" data-id="${esc(s.id)}">Quitar evento añadido</button></div>`:'')).join('')}${gym.map(gymCard).join('')}${done.map(w=>`<div class="session"><div class="session-bar"></div><div class="body"><strong>Gimnasio realizado · ${esc(w.dayTitle)}</strong><p>${w.sets.length} series registradas · Esfuerzo percibido: ${w.rpe??'—'}/10</p></div></div>`).join('')}${(!ses.length&&!gym.length&&!done.length)?'<p class="muted small">No hay actividades indicadas en el documento para esta fecha. No implica descanso obligatorio.</p>':''}</div>`}

<div class="grid2"><div class="card"><div class="card-head"><div><div class="eyebrow">${esc(fDate(p.start))} — ${esc(fDate(p.end))}</div><h2>Calendario semanal</h2></div><button class="btn small" data-action="go" data-page="calendar">Detalle</button></div>${dayTiles()}<p class="fineprint">Los días sin sesión en el PDF no se consideran automáticamente días de descanso.</p></div><div class="card"><div class="card-head"><h2>Tu siguiente objetivo</h2>${badge('Press banca','red')}</div><div class="grid2" style="gap:9px"><div class="surface"><div class="box-label">Marca de referencia</div><div class="kpi-value" style="margin-top:10px">${esc(state.profile.bench||'—')} <span class="small">kg</span></div></div><div class="surface"><div class="box-label">Objetivo personal</div><div class="kpi-value" style="margin-top:10px">${esc(state.profile.goalBench||'—')} <span class="small">kg</span></div></div></div><div style="margin-top:17px"><div class="progress-bar"><span style="width:${Math.max(0,Math.min(100,Math.round(100*(state.profile.bench||0)/(state.profile.goalBench||100))))}%"></span></div><p class="fineprint">Marcas editables en el perfil. Las cargas recomendadas requieren registrar tus resultados, no se infieren únicamente del PDF.</p></div></div></div>

function calendar(){const p=plan();const gymOptions=state.gym.days.map(d=>`<option value="${esc(d.id)}">${esc(d.title)} · ${esc(d.subtitle)}</option>`).join('');return `${heading('Calendario del equipo','Planificación semanal del entrenador y sesiones personales de fuerza.')}<div class="card mb"><div class="card-head"><div><div class="eyebrow">Planificación guardada</div><h2>Microciclo ${esc(p.week??'—')}</h2></div><select class="select" id="plan-picker" style="max-width:220px" aria-label="Plan semanal">${state.plans.slice().sort((a,b)=>b.start.localeCompare(a.start)).map(w=>`<option value="${esc(w.start)}" ${w.start===ui.planStart?'selected':''}>${esc(w.start)} · ${esc('Semana '+(w.week||'?'))}</option>`).join('')}</select></div>${dayTiles()}<p class="fineprint">Fuente: ${esc(p.source||'Importación manual')} · ${esc(p.season||'temporada no indicada')}</p></div><div class="mb">${scheduleInsightCard()}</div><div class="grid2"><div class="stack">${panelForDate(ui.selectedDate)}<div class="card"><h2 style="margin-bottom:14px">Asignar gimnasio a una fecha</h2><form id="assign-form" class="stack"><div class="fields"><div class="field"><label for="assign-session">Sesión de gimnasio</label><select class="select" name="session" id="assign-session">${gymOptions}</select></div><div class="field"><label for="assign-date">Fecha</label><input class="input" type="date" id="assign-date" name="date" required value="${ui.selectedDate}"></div></div><button class="btn primary" type="submit">Asignar sesión</button></form><p class="fineprint">No se asignan automáticamente sesiones antes de los partidos. Comprueba la carga con el preparador.</p></div><div class="card"><h2 style="margin-bottom:14px">Añadir cambio o partido manual</h2><form id="manual-event-form" class="stack"><div class="fields"><div class="field"><label>Fecha</label><input class="input" type="date" name="date" value="${ui.selectedDate}" required></div><div class="field"><label>Tipo</label><select class="select" name="kind"><option value="match">Partido</option><option value="rugby">Entrenamiento</option><option value="rest">Descanso explícito</option></select></div><div class="field"><label>Hora (opcional)</label><input class="input" name="start" type="time"></div><div class="field"><label>Duración en minutos (opcional)</label><input class="input" name="minutes" type="number" min="0" max="360"></div></div><div class="field"><label>Objetivo / rival / observación</label><input class="input" name="objective" maxlength="240" placeholder="Cambio comunicado por el entrenador"></div><button type="submit" class="btn">Añadir al calendario</button></form><p class="fineprint">Los eventos añadidos manualmente se pueden eliminar. No modifican el PDF original.</p></div></div><div class="card"><h2 style="margin-bottom:14px">Semana completa</h2>${dates7(p.start).map(iso=>{const list=sessionsOn(iso);const gym=assignedOn(iso);return `<div class="item-row"><div><strong>${esc(shortDay[fromIso(iso).getDay()])} ${fromIso(iso).getDate()}</strong><div class="meta">${esc(list.find(x=>x.kind==='rugby')?.objective||list.find(x=>x.kind==='match')?.objective||list.find(x=>x.kind==='rest')?.objective||(gym.length?'Gimnasio personal':'Sin sesión indicada'))}</div></div><div class="btn-group">${gym.map(d=>`<button class="btn small red" title="Quitar ${esc(d.subtitle)}" data-action="unassign" data-id="${esc(d.id)}">Quitar gym</button>`).join('')}<button class="btn small" data-action="date" data-date="${iso}">Ver</button></div></div>`}).join('')}</div></div>`}
function exerciseCard(e){const reps=phaseReps(e),rir=phaseRir(e);const recommendation=ENGINE.recommendWeight(e,state);const sets=Number(e.sets)||0;const draft=state.drafts[ui.gymDay]||{};return `<div class="exercise"><div class="exercise-header"><div><div class="eyebrow">Bloque ${esc(e.group||'Individual')}</div><strong>${esc(e.name)}</strong><div class="exercise-meta">${sets?badge(sets+' series','gray'):''}${reps!==null&&reps!==undefined?badge(String(reps)+' reps','gray'):''}${rir!==null&&rir!==undefined?badge('RIR '+rir):''}</div>${e.notes?`<div class="exercise-notes">${esc(e.notes)}</div>`:''}${recommendation?`<div class="exercise-notes"><strong>Progresión orientativa: ${esc(recommendation.kg)} kg</strong><br>${esc(recommendation.reason)}</div>`:''}</div><button class="btn small ghost" data-action="edit-ex" data-id="${esc(e.id)}" aria-label="Editar ${esc(e.name)}">Editar</button></div>${sets?`<div class="exercise-sets">${Array.from({length:sets},(_,i)=>{const r=draft[`${e.id}--${i}`]||{};return `<div class="set-row"><label>S${i+1}</label><input class="input" type="number" min="0" step="0.5" data-ex="${esc(e.id)}" data-index="${i}" data-field="kg" value="${esc(r.kg||'')}" placeholder="kg" aria-label="Peso ${esc(e.name)} serie ${i+1}"><input class="input" type="text" data-ex="${esc(e.id)}" data-index="${i}" data-field="reps" value="${esc(r.reps||'')}" placeholder="${esc(String(reps||'reps'))}" aria-label="Repeticiones ${esc(e.name)} serie ${i+1}"><input class="set-check" type="checkbox" data-ex="${esc(e.id)}" data-index="${i}" data-field="done" ${r.done?'checked':''} aria-label="Serie ${i+1} completada"></div>`}).join('')}</div>`:`<p class="form-help" style="padding:0 15px 14px">Protocolo individual: registra detalles en las notas del entrenamiento.</p>`}</div>`}
function gym(){const d=currentDay();const already=state.assignments[d.id]||'';const dayList=state.gym.days;return `${heading('Gimnasio','Rutinas originales del preparador físico y registro de cargas.')}
<div class="card mb"><div class="fields"><div class="field"><label for="phase-select">Bloque del mesociclo</label><select class="select" id="phase-select">${state.gym.phases.map((p,i)=>`<option value="${i}" ${state.phase===i?'selected':''}>${esc(p)}</option>`).join('')}</select><div class="form-help">No se deduce de la semana 12 del equipo: selecciona el bloque vigente.</div></div><div class="field"><label for="gym-assignment">Fecha asignada a esta sesión</label><input class="input" type="date" id="gym-assignment" value="${esc(already)}"><div class="form-help">La fecha se guarda por sesión, sin cambiar las indicaciones del preparador.</div></div></div></div>
<div class="choose-tabs mb" role="tablist">${dayList.map(x=>`<button class="tab ${x.id===d.id?'active':''}" data-action="gym-day" data-id="${x.id}" role="tab" aria-selected="${x.id===d.id}">${esc(x.title)} · ${esc(x.subtitle)}</button>`).join('')}</div>
<div class="grid2 gym-grid"><div class="stack"><div class="card"><div class="card-head"><div><div class="eyebrow">${esc(state.gym.phases[state.phase])}</div><h2>${esc(d.title)} · ${esc(d.subtitle)}</h2></div>${badge(d.type==='recovery'?'Recuperación':d.type==='power'?'Potencia':'Full Body')}</div><div class="notice good">Prescripción extraída del PDF. Anota la carga y las repeticiones reales; el número de repeticiones indicado es el objetivo, no una serie ya realizada.</div><h3 class="mt" style="margin-bottom:9px">Movilidad y activación</h3><div class="pill-list">${d.warmup.map(w=>`<span>${esc(w)}</span>`).join('')}</div></div><div class="card"><div class="card-head"><h2>Ejercicios del día</h2>${badge(d.exercises.length+' ejercicios','gray')}</div>${d.exercises.map(exerciseCard).join('')}<form id="workout-form" class="stack"><div class="fields"><div class="field"><label for="workout-date">Fecha realizada</label><input id="workout-date" class="input" type="date" name="date" value="${esc(already||dateIso(new Date()))}" required></div><div class="field"><label for="workout-rpe">Esfuerzo percibido (0–10)</label><select id="workout-rpe" class="select" name="rpe"><option value="">No indicado</option>${Array.from({length:11},(_,i)=>`<option value="${i}">${i}</option>`).join('')}</select></div></div><div class="field"><label for="workout-notes">Notas de la sesión</label><textarea id="workout-notes" name="notes" class="textarea" placeholder="Fatiga, molestias, ajustes autorizados, duración…"></textarea></div><button class="btn primary full" type="submit">Guardar entrenamiento</button><p class="fineprint">Marca las series completadas. Las series vacías no se guardarán como realizadas.</p></form></div></div><div class="stack"><div class="card"><h2 style="margin-bottom:12px">Criterios de la rutina</h2><ul class="textlist">${state.gym.notes.map(n=>`<li>${esc(n)}</li>`).join('')}</ul></div><div class="card"><h2 style="margin-bottom:12px">Sesiones anteriores</h2>${state.workouts.filter(w=>w.dayId===d.id).slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5).map(w=>`<div class="item-row"><div><strong>${esc(fDate(w.date))}</strong><div class="meta">${w.sets.length} series · RPE ${esc(w.rpe??'—')}</div></div>${badge('Guardada')}</div>`).join('')||'<p class="muted small">Aún no has registrado este entrenamiento.</p>'}</div><div class="notice">La IA todavía no modifica automáticamente cargas ni prescribe readaptación. Esta primera versión registra y compara lo realmente ejecutado.</div></div></div>`}
function progress(){const all=state.workouts.slice().sort((a,b)=>b.date.localeCompare(a.date));const sets=all.flatMap(w=>w.sets.map(s=>({...s,date:w.date})));const weighted=sets.filter(s=>Number(s.kg)>0);const best={};for(const s of weighted){if(!best[s.exercise]||Number(s.kg)>Number(best[s.exercise].kg))best[s.exercise]=s;}const ranked=Object.values(best).sort((a,b)=>b.kg-a.kg).slice(0,8);const v=all.reduce((n,w)=>n+volume(w),0);const sleep=state.wellness.slice(-7).map(w=>Number(w.sleepHours)||0);const avgSleep=sleep.length?(sleep.reduce((a,b)=>a+b,0)/sleep.length).toFixed(1):null;const rankPoints=all.length*50+sets.length*5+state.wellness.length*10;const personalRank=rankPoints<250?'Inicial':rankPoints<750?'Constante':rankPoints<1500?'Avanzando':'Veterano';const benchSets=sets.filter(x=>/press banca/i.test(x.exercise)&&Number(x.kg)>0&&Number(x.reps)>0&&Number(x.reps)<=12);const estimated=benchSets.length?Math.max(...benchSets.map(s=>Math.round(Number(s.kg)*(1+Number(s.reps)/30)*10)/10)):null;const timeline=state.wellness.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,7).reverse();return `${heading('Progreso','Marcas reales, volumen registrado y adherencia a las sesiones.')}
<div class="grid4 mb"><div class="card kpi"><div class="kpi-label">Rango personal</div><div class="kpi-value" style="font-size:1.4rem">${esc(personalRank)}</div><div class="kpi-foot">${rankPoints} puntos por constancia</div></div><div class="card kpi"><div class="kpi-label">Sueño medio (7 registros)</div><div class="kpi-value">${esc(avgSleep??'—')} ${avgSleep?'h':''}</div><div class="kpi-foot">Autodeclarado</div></div><div class="card kpi"><div class="kpi-label">1RM press banca estimado</div><div class="kpi-value">${esc(estimated??'—')}</div><div class="kpi-foot">Epley; solo series de 1–12 reps</div></div><div class="card kpi"><div class="kpi-label">Registros recuperación</div><div class="kpi-value">${state.wellness.length}</div><div class="kpi-foot">Estado y fatiga</div></div></div><div class="card mb"><div class="card-head"><h2>Evolución de energía y fatiga</h2>${badge('Últimos 7 registros','gray')}</div>${timeline.length?timeline.map(w=>`<div class="metric-row"><span>${esc(fDate(w.date))}</span><div class="metric-track"><span class="metric-energy" style="width:${Math.min(100,Number(w.energy)*10)}%"></span></div><div class="metric-track"><span class="metric-fatigue" style="width:${Math.min(100,Number(w.fatigue)*10)}%"></span></div><span>${esc(w.energy)}/${esc(w.fatigue)}</span></div>`).join(''):'<p class="muted small">Registra tu estado en Entrenador IA para ver tendencias.</p>'}<p class="fineprint">Barra verde = energía; barra roja = fatiga. Datos autodeclarados, sin diagnóstico.</p></div>
<div class="grid4 mb"><div class="card kpi"><div class="kpi-label">Sesiones registradas</div><div class="kpi-value">${all.length}</div><div class="kpi-foot">Gimnasio</div></div><div class="card kpi"><div class="kpi-label">Series registradas</div><div class="kpi-value">${sets.length}</div><div class="kpi-foot">Series completadas</div></div><div class="card kpi"><div class="kpi-label">Volumen registrado</div><div class="kpi-value">${Math.round(v).toLocaleString('es-ES')}</div><div class="kpi-foot">kg × repeticiones numéricas</div></div><div class="card kpi"><div class="kpi-label">Ejercicios con carga</div><div class="kpi-value">${Object.keys(best).length}</div><div class="kpi-foot">Máximos registrados</div></div></div>
<div class="grid2"><div class="card"><div class="card-head"><h2>Mejores cargas registradas</h2>${badge('Histórico','gray')}</div>${ranked.length?ranked.map(s=>`<div class="item-row"><div><strong>${esc(s.exercise)}</strong><div class="meta">${esc(fDate(s.date))} · ${esc(s.reps||'—')} repeticiones</div></div><strong>${esc(s.kg)} kg</strong></div>`).join(''):'<p class="muted">No existen aún series con pesos registrados. Comienza por el apartado Gimnasio.</p>'}<p class="fineprint">Son las cargas máximas introducidas por ejercicio, no estimaciones de 1RM.</p></div><div class="card"><div class="card-head"><h2>Últimas sesiones</h2><button class="btn small" data-action="export-csv">Exportar CSV</button></div>${all.length?all.slice(0,12).map(w=>`<div class="history-item"><span class="muted small">${esc(fDate(w.date))}</span><div><strong>${esc(w.dayTitle)}</strong><div class="meta">${w.sets.length} series · RPE ${esc(w.rpe??'—')} · ${Math.round(volume(w))} kg</div></div><button class="btn small red" data-action="delete-workout" data-id="${esc(w.id)}">Borrar</button></div>`).join(''):'<p class="muted">Aún no hay entrenamientos guardados.</p>'}</div></div>`}

 ${i.proposed.length?i.proposed.map(p=>`<div class="item-row"><div><strong>${esc(p.title)}</strong><div class="meta">${esc(fDate(p.date,'long'))} · ${esc(p.reason)}</div></div><button class="btn small" data-action="assign-proposed" data-id="${esc(p.id)}" data-date="${p.date}">Asignar</button></div>`).join(''):'<p class="muted">No hay huecos suficientes para proponer sesiones adicionales sin conflictos.</p>'}
 ${i.excluded.map(x=>`<div class="fineprint">${esc(x)}</div>`).join('')}

 <p class="fineprint">Los días sin sesión indicada no son necesariamente días de descanso. Verifica la planificación con tus técnicos.</p></div></div>
 <div class="stack"><div class="card"><div class="card-head"><h2>Google Gemini</h2>${badge(ENGINE.hasKey()||state.aiSettings.mode==='proxy'?'Configurable':'Sin conectar','gray')}</div>
 <p class="muted small">Usamos la API Gemini, como en tus otras aplicaciones. Para preservar tu clave, no la incluimos en la web pública ni la guardamos. La IA es opcional.</p>
 <form id="ai-settings-form" class="stack"><div class="field"><label>Forma de conexión</label><select name="mode" class="select" id="ai-mode"><option value="personal" ${state.aiSettings.mode!=='proxy'?'selected':''}>Clave personal temporal (solo uso propio)</option><option value="proxy" ${state.aiSettings.mode==='proxy'?'selected':''}>Servidor seguro (recomendado para compartir)</option></select></div><div class="field"><label>Clave de Google AI Studio (solo sesión actual)</label><input class="input" type="password" name="apiKey" autocomplete="off" placeholder="${ENGINE.hasKey()?'Clave introducida en esta sesión':'Pega aquí tu clave personal'}"></div><div class="field"><label>Token de acceso del servidor (solo esta sesión)</label><input class="input" type="password" name="accessToken" autocomplete="off" placeholder="Token del servidor, si está configurado"></div><div class="field"><label>URL HTTPS del servidor seguro (opcional)</label><input class="input" type="url" name="endpoint" placeholder="https://tu-dominio.com/api/gemini" value="${attr(state.aiSettings.endpoint||'')}"></div><button class="btn" type="submit">Configurar IA</button></form><div class="actions" style="margin-top:8px"><button class="btn small red" data-action="clear-ai-key">Olvidar clave de esta sesión</button></div><p class="fineprint">El modo con clave personal envía las peticiones directamente a Google. No lo compartas con compañeros con tu clave incluida. Para uso colectivo se necesita un servidor con la clave en un secreto protegido. Consulta el archivo README.</p></div>

function docs(){return `${heading('Documentos y perfil','Importa nuevos PDF, gestiona tus datos y prepara una copia de seguridad.')}
<div class="grid2 mb"><div class="card"><div class="card-head"><h2>Planificación semanal</h2>${badge('Microciclos','red')}</div><label class="upload"><input type="file" accept=".pdf,application/pdf" data-pdf="weekly" aria-label="Subir planificación semanal PDF"><span class="upload-icon">▣</span><strong>Seleccionar PDF del entrenador</strong><small>Lee los entrenamientos, fechas y actividades para revisarlos antes de guardarlos.</small></label></div><div class="card"><div class="card-head"><h2>Rutina del preparador</h2>${badge('Mesociclo')}</div><label class="upload"><input type="file" accept=".pdf,application/pdf" data-pdf="gym" aria-label="Subir rutina gimnasio PDF"><span class="upload-icon">▤</span><strong>Seleccionar PDF del gimnasio</strong><small>Detecta el formato de fuerza; la tabla de un nuevo mesociclo requiere revisión.</small></label></div></div>
<div class="notice mb">Importación local: los archivos se procesan en el navegador. Si pulsas «Extraer con Google Gemini», se enviará ese PDF a Google exclusivamente para analizarlo.  Los datos guardados permanecen en este dispositivo. Para leer PDFs localmente por primera vez se necesita conexión a internet y cargar PDF.js.</div>
<div class="grid2"><div class="stack"><div class="card"><h2 style="margin-bottom:14px">Documentos registrados</h2>${state.docs.slice().reverse().map(d=>`<div class="item-row"><div><strong>${esc(d.name)}</strong><div class="meta">${esc(d.type==='gym'?'Rutina de fuerza':'Planificación semanal')} · ${esc(d.status||'Registrado')}</div></div>${badge(esc(d.date||''),'gray')}</div>`).join('')}</div><div class="card"><h2 style="margin-bottom:12px">Histórico de mesociclos</h2><p class="muted small">Versiones anteriores de la rutina, conservadas antes de confirmar una nueva extracción.</p>${state.gymArchives.length?state.gymArchives.map((g,i)=>`<div class="item-row"><div><strong>${esc(g.gym.source||'Plan anterior')}</strong><div class="meta">${esc(g.at.slice(0,10))}</div></div><button class="btn small" data-action="restore-gym" data-index="${i}">Recuperar</button></div>`).join(''):'<p class="muted small">Todavía no hay versiones anteriores.</p>'}</div><div class="card"><h2 style="margin-bottom:12px">Copias y portabilidad</h2><p class="muted small">Exporta tus datos antes de cambiar de móvil o borrar datos del navegador. El modo sin cuentas no sincroniza entre dispositivos.</p><div class="btn-group"><button class="btn primary" data-action="export-json">Descargar copia JSON</button><button class="btn" data-action="export-csv">Descargar CSV</button><button class="btn" data-action="export-ics">Calendario (.ics)</button><label class="btn" style="position:relative;overflow:hidden">Restaurar JSON<input type="file" accept="application/json,.json" id="restore-file" style="position:absolute;inset:0;opacity:0;cursor:pointer"></label></div></div></div>
<div class="stack"><div class="card"><h2 style="margin-bottom:14px">Mi perfil</h2><form id="profile-form" class="stack"><div class="fields"><div class="field"><label>Nombre o alias</label><input class="input" name="name" maxlength="90" value="${attr(state.profile.name||'')}"></div><div class="field"><label>Posición</label><input class="input" name="position" maxlength="90" value="${attr(state.profile.position||'')}"></div><div class="field"><label>Peso corporal · kg</label><input class="input" name="weight" type="number" min="0" step="0.1" value="${esc(state.profile.weight||'')}"></div><div class="field"><label>Marca sentadilla · kg</label><input class="input" name="squat" type="number" min="0" step="0.5" value="${esc(state.profile.squat||'')}"></div><div class="field"><label>Marca press banca · kg</label><input class="input" name="bench" type="number" min="0" step="0.5" value="${esc(state.profile.bench||'')}"></div><div class="field"><label>Marca peso muerto · kg</label><input class="input" name="deadlift" type="number" min="0" step="0.5" value="${esc(state.profile.deadlift||'')}"></div><div class="field"><label>Objetivo press banca · kg</label><input class="input" name="goalBench" type="number" min="0" step="0.5" value="${esc(state.profile.goalBench||'')}"></div></div><button class="btn primary" type="submit">Guardar perfil</button></form></div><div class="card"><h2 style="margin-bottom:12px">Compartir con el equipo</h2><p class="muted small">Cada jugador tiene datos privados en su navegador. La aplicación no requiere registro. Para usar Gemini con todo el equipo hará falta un servidor que proteja la clave. No se publican PDFs ni registros privados automáticamente.</p><button class="btn" data-action="share">Compartir dirección de la app</button><hr class="divider"><p class="fineprint">CAR Performance · prototipo independiente de uso personal; no es una aplicación oficial del club. No sustituye las indicaciones de los técnicos.</p></div></div></div>`}
function editModal(){const editor=ui.editor;if(!editor)return '';const d=currentDay(),e=d.exercises.find(e=>e.id===editor);if(!e)return '';return `<div class="modal-bg" role="dialog" aria-modal="true"><div class="modal"><div class="modal-head"><h2>Editar prescripción</h2><button class="btn small ghost" data-action="close-modal">Cerrar ×</button></div><form id="exercise-form" class="stack"><input type="hidden" name="id" value="${esc(e.id)}"><div class="fields"><div class="field"><label>Ejercicio</label><input class="input" name="name" value="${attr(e.name)}"></div><div class="field"><label>Series</label><input class="input" type="number" min="0" max="15" name="sets" value="${esc(e.sets??0)}"></div></div><p class="fineprint">Repeticiones por bloque. Si las dejas vacías se utiliza el valor original.</p><div class="fields">${state.gym.phases.map((p,i)=>`<div class="field"><label>${esc(p)}</label><input class="input" name="rep${i}" value="${attr(String(e.repsByPhase?.[i]??e.reps??''))}" placeholder="8 o 6/lado"></div>`).join('')}</div><div class="field"><label>Observaciones</label><textarea class="textarea" name="notes">${esc(e.notes||'')}</textarea></div><div class="actions"><button type="button" class="btn" data-action="close-modal">Cancelar</button><button type="submit" class="btn primary">Guardar cambio local</button></div></form><p class="fineprint">Los cambios manuales son tuyos y no modifican el PDF original.</p></div></div>`}
function importModal(){const r=ui.importReview;if(!r)return '';if(r.type==='gym')return `<div class="modal-bg" role="dialog" aria-modal="true"><div class="modal"><div class="modal-head"><h2>Revisión · Rutina de fuerza</h2><button class="btn small ghost" data-action="close-modal">Cerrar ×</button></div><p><strong>${esc(r.file)}</strong></p>${r.parsedGym?`<div class="notice good">Gemini ha propuesto ${r.parsedGym.days.length} días y ${r.parsedGym.days.reduce((n,d)=>n+d.exercises.length,0)} ejercicios. Verifica todas las fases y series antes de reemplazar el plan.</div>${r.parsedGym.days.map(d=>`<div class="surface mt"><strong>${esc(d.title)} · ${esc(d.subtitle)}</strong>${d.exercises.map(e=>`<div class="item-row"><div><strong>${esc(e.name)}</strong><div class="meta">${esc(e.sets)} series · ${esc(e.repsByPhase.join(' / '))} reps · RIR ${esc(e.rirByPhase.map(x=>x??'—').join('/'))}</div></div></div>`).join('')}</div>`).join('')}`:''}${(r.aiWarnings||[]).map(w=>`<div class="notice">${esc(w)}</div>`).join('')}${r.known?`<div class="notice good">Detectado formato del documento de referencia: tres sesiones de fuerza, recuperación y tabla de 8 semanas.</div><p class="muted small">Puedes confirmar la vinculación de este PDF con el plan inicial ya transcrito. Si es una versión modificada, comprueba la tabla y edita ejercicios y repeticiones en Gimnasio; esta versión no reemplaza automáticamente los valores de una nueva tabla.</p>`:`<div class="notice">No se ha reconocido con suficiente confianza la tabla de fuerza. Se registrará el documento para revisión, pero la rutina actualmente guardada no cambiará.</div>`}<div class="actions"><button class="btn" data-action="close-modal">Cancelar</button><button class="btn" data-action="ai-import-pdf" ${ui.aiBusy?'disabled':''}>${ui.aiBusy?'Analizando PDF…':'Extraer con Google Gemini'}</button>${r.parsedGym?'<button class="btn primary" data-action="apply-gym-ai">Confirmar nuevo mesociclo</button>':`<button class="btn primary" data-action="confirm-gym-import">${r.known?'Vincular documento':'Registrar para revisión'}</button>`}</div></div></div>`;
 const p=r.data;return `<div class="modal-bg" role="dialog" aria-modal="true"><div class="modal"><div class="modal-head"><div><div class="eyebrow">Revisa antes de guardar</div><h2>Planificación semanal detectada</h2></div><button class="btn small ghost" data-action="close-modal">Cerrar ×</button></div><form id="weekly-import-form" class="stack"><div class="fields"><div class="field"><label>Semana del equipo (microciclo)</label><input class="input" type="number" min="1" max="60" name="week" value="${esc(p.week||'')}"></div><div class="field"><label>Inicio de la semana</label><input class="input" type="date" name="start" required value="${esc(p.start||'')}"></div></div><div class="notice">${r.known?'Se ha reconocido el PDF de referencia. Verifica que corresponda al mismo documento.':'Extracción asistida: confirma horarios, objetivos y actividades. Los datos dudosos pueden estar incompletos.'}</div><div class="actions"><button type="button" class="btn" data-action="ai-import-pdf" ${ui.aiBusy?'disabled':''}>${ui.aiBusy?'Analizando…':'Reanalizar con Google Gemini'}</button></div>${(r.aiWarnings||[]).map(w=>`<div class="notice">${esc(w)}</div>`).join('')}${[0,1,2,3,4,5,6].map(i=>{const day=plusDays(p.start,i),s=p.sessions.find(s=>s.date===day&&s.kind==='rugby'),rest=p.sessions.find(s=>s.date===day&&s.kind==='rest');return `<div class="surface"><strong>${esc(wd[fromIso(day).getDay()])} · ${esc(fDate(day))}</strong><div class="fields mt"><div class="field"><label>Tipo</label><select class="select" name="kind${i}"><option value="none" ${!s&&!rest?'selected':''}>Sin sesión indicada</option><option value="rugby" ${s?'selected':''}>Rugby</option><option value="rest" ${rest?'selected':''}>Descanso de equipo</option><option value="match">Partido</option></select></div><div class="field"><label>Hora de inicio</label><input class="input" type="time" name="time${i}" value="${esc(s?.start||'')}"></div><div class="field"><label>Duración (minutos)</label><input class="input" type="number" min="0" max="600" name="minutes${i}" value="${esc(s?.minutes??'')}"></div><div class="field"><label>Objetivo o nota</label><input class="input" name="objective${i}" value="${attr(s?.objective||rest?.objective||'')}"></div><div class="field"><label>Color intensidad (recuadro del PDF)</label><select class="select" name="color${i}"><option value="" ${!s?.officialIntensity?'selected':''}>No indicado / incierto</option><option value="yellow" ${s?.officialIntensity==='yellow'?'selected':''}>Amarillo</option><option value="red" ${s?.officialIntensity==='red'?'selected':''}>Rojo</option><option value="green" ${s?.officialIntensity==='green'?'selected':''}>Verde</option></select></div></div><div class="field mt"><label>Actividades (una por línea: AF: Movilidad)</label><textarea class="textarea" name="activities${i}" rows="2">${esc(s?.activities?.map(a=>a.code+': '+a.name).join('\n')||'')}</textarea></div></div>`}).join('')}<div class="actions"><button class="btn" type="button" data-action="close-modal">Cancelar</button><button class="btn primary" type="submit">Guardar planificación revisada</button></div></form></div></div>`}

document.addEventListener('click', async ev=>{const b=ev.target.closest('[data-action]');if(!b)return;const a=b.dataset.action;
 switch(a){
 case 'go':ui.page=b.dataset.page;ui.editor=null;ui.importReview=null;render();break;
 case 'date':ui.selectedDate=b.dataset.date;render();break;
 case 'gym-day':ui.gymDay=b.dataset.id;ui.page='gym';render();break;
 case 'unassign':delete state.assignments[b.dataset.id];save();render();toast('Asignación eliminada');break;
 case 'close-modal':ui.importReview=null;ui.editor=null;render();break;
 case 'edit-ex':ui.editor=b.dataset.id;render();break;
 case 'confirm-gym-import':{const r=ui.importReview;if(!r)break;state.docs.push({id:dId(),name:r.file,type:'gym',date:dateIso(new Date()),status:r.known?'Vinculado al plan inicial; comprobar posibles cambios':'Pendiente de transcripción manual'});save();ui.importReview=null;render();toast(r.known?'Documento vinculado. Las prescripciones originales se conservan.':'Documento registrado para revisión.');break;}
 case 'delete-workout':if(confirm('¿Eliminar este entrenamiento registrado?')){state.workouts=state.workouts.filter(w=>w.id!==b.dataset.id);save();render();toast('Entrenamiento eliminado')}break;
 case 'export-json':download('car-performance-copia-'+dateIso(new Date())+'.json',JSON.stringify(state,null,2),'application/json');break;
 case 'export-csv':exportCsv();break;
 case 'export-ics':download('car-performance-semana-'+plan().start+'.ics',ENGINE.makeIcs(state,plan()),'text/calendar;charset=utf-8');break;
 case 'restore-gym':{const g=state.gymArchives[Number(b.dataset.index)];if(!g)break;if(!confirm('¿Restaurar este mesociclo? Se guardará el actual en el historial y se quitarán sus asignaciones.'))break;state.gymArchives.splice(Number(b.dataset.index),1);state.gymArchives.push({at:new Date().toISOString(),gym:clone(state.gym)});state.gym=clone(g.gym);state.phase=0;state.assignments={};state.drafts={};ui.gymDay=state.gym.days.find(d=>d.type!=='recovery')?.id||state.gym.days[0].id;save();render();toast('Plan de gimnasio anterior restaurado');break;}
 case 'delete-manual-event':{const p=plan();if(!confirm('¿Quitar este evento manual?'))break;p.sessions=p.sessions.filter(x=>x.id!==b.dataset.id||!x.manual);save();render();toast('Evento manual eliminado');break;}

 case 'clear-ai-key':ENGINE.forgetKey();render();toast('Clave temporal olvidada');break;
 case 'assign-proposed':{const day=state.gym.days.find(d=>d.id===b.dataset.id);const d=b.dataset.date;if(!day||!ENGINE.checkDate(d))break;if(!confirm(`¿Asignar ${day.subtitle} a ${fDate(d,'long')}? Comprueba que no contradiga la planificación del preparador.`))break;state.assignments[day.id]=d;save();render();toast('Sesión asignada');break;}
 case 'assign-all':{const insight=ENGINE.evaluateWeek(state,plan());if(!insight.proposed.length)break;if(!confirm('¿Asignar las sesiones propuestas? Son orientativas y no sustituyen la planificación del preparador.'))break;for(const x of insight.proposed)state.assignments[x.id]=x.date;save();render();toast('Distribución personal guardada');break;}
 case 'analyze-week':{ui.aiBusy=true;render();try{const payload={profile:{position:state.profile.position,weight:state.profile.weight,goalBench:state.profile.goalBench},plan:plan(),plannedLoad:plan().sessions.filter(s=>s.kind==='rugby').map(s=>({date:s.date,officialIntensity:s.officialIntensity??null,estimated:ENGINE.estimateSessionLoad(s)})),rugbyRpe:state.rugbyRpe||{},gym:{phases:state.gym.phases,phase:state.phase,days:state.gym.days.map(d=>({id:d.id,subtitle:d.subtitle,type:d.type,exercises:d.exercises.map(e=>({name:e.name,sets:e.sets,reps:phaseReps(e),rir:phaseRir(e)}))}))},wellness:state.wellness.slice(-7),workouts:state.workouts.slice(-7).map(w=>({date:w.date,rpe:w.rpe,dayTitle:w.dayTitle,sets:w.sets.length}))};const r=await ENGINE.request('coach',payload,state.aiSettings);ui.aiResult={summary:String(r.summary||''),observations:Array.isArray(r.observations)?r.observations.slice(0,7):[],suggested:Array.isArray(r.suggested)?r.suggested.slice(0,5):[],warnings:Array.isArray(r.warnings)?r.warnings.slice(0,7):[]};state.aiLog.push({date:new Date().toISOString(),summary:ui.aiResult.summary});save();toast('Análisis completado')}catch(e){toast('Gemini: '+e.message,true)}finally{ui.aiBusy=false;render()}break;}
 case 'ai-import-pdf':{const file=ui.fileToAnalyze,review=ui.importReview;if(!file||!review){toast('Vuelve a seleccionar el PDF para analizarlo',true);break;}if(file.size>15*1024*1024){toast('Este PDF excede el límite de 15 MB para el análisis con IA',true);break;}if(!confirm('El PDF se enviará a Google Gemini para analizar su contenido. ¿Continuar?'))break;ui.aiBusy=true;render();try{const json=await ENGINE.request(review.type==='weekly'?'pdf-weekly':'pdf-gym',{pdfBase64:await ENGINE.toB64(file)},state.aiSettings);if(review.type==='weekly'){const parsed=ENGINE.validateWeekly(json,file.name);ui.importReview={...review,known:false,data:parsed,aiWarnings:Array.isArray(json.warnings)?json.warnings.slice(0,10):[]}}else{ui.importReview={...review,parsedGym:ENGINE.validateGym(json,file.name),aiWarnings:Array.isArray(json.warnings)?json.warnings.slice(0,10):[]}}toast('Extracción recibida. Confirma los datos antes de guardarlos.')}catch(e){toast('No se pudo analizar con Google: '+e.message,true)}finally{ui.aiBusy=false;render()}break;}
 case 'apply-gym-ai':{const g=ui.importReview?.parsedGym;if(!g)break;if(!confirm('¿Sustituir el mesociclo ACTUAL por el que has revisado? Se conservará una copia interna y el historial de entrenamientos, pero se quitarán asignaciones de sesiones antiguas.'))break;state.gymArchives.push({at:new Date().toISOString(),gym:clone(state.gym)});state.gym=g;state.phase=0;state.assignments={};state.drafts={};ui.gymDay=g.days.find(d=>d.type!=='recovery')?.id||g.days[0].id;state.docs.push({id:dId(),name:ui.importReview.file,type:'gym',date:dateIso(new Date()),status:'Nuevo mesociclo confirmado tras análisis con Gemini'});ui.importReview=null;ui.fileToAnalyze=null;ui.page='gym';save();render();toast('Mesociclo reemplazado y archivado');break;}

 case 'share':{if(location.protocol==='file:'||location.hostname==='localhost'||location.hostname==='127.0.0.1'){toast('Aún no está publicada. Se puede compartir después de alojarla en HTTPS.',true);break;}try{if(navigator.share){await navigator.share({title:'CAR Performance',url:location.href})}else if(navigator.clipboard){await navigator.clipboard.writeText(location.href);toast('Enlace copiado')}}catch(e){if(e.name!=='AbortError')toast('No se pudo compartir el enlace',true)}break;}
 }
});
document.addEventListener('change',async ev=>{const t=ev.target;
 if(t.id==='phase-select'){state.phase=Number(t.value);save();render();toast('Bloque de fuerza actualizado')}
 else if(t.id==='plan-picker'){ui.planStart=t.value;ui.selectedDate=t.value;render()}
 else if(t.id==='gym-assignment'){if(t.value){state.assignments[ui.gymDay]=t.value;toast('Fecha asignada')}else{delete state.assignments[ui.gymDay];toast('Fecha retirada')}save();render()}
 else if(t.matches('[data-pdf]')){if(t.files?.length){await importPdf(t.files[0],t.dataset.pdf)}t.value=''}
 else if(t.id==='restore-file'){if(t.files?.length)await restore(t.files[0]);t.value=''}
 else if(t.dataset.ex){const key=t.dataset.ex+'--'+t.dataset.index;state.drafts[ui.gymDay]??={};state.drafts[ui.gymDay][key]??={};state.drafts[ui.gymDay][key][t.dataset.field]=t.dataset.field==='done'?t.checked:t.value;save()}
});
document.addEventListener('submit',ev=>{const form=ev.target;if(!form.id&&!form.classList.contains('rugby-rpe-form'))return;ev.preventDefault();const fd=new FormData(form);
 if(form.id==='ai-settings-form'){const mode=String(fd.get('mode'));state.aiSettings={mode:mode==='proxy'?'proxy':'personal',endpoint:String(fd.get('endpoint')||'').trim()};const key=String(fd.get('apiKey')||'').trim();if(key)ENGINE.setKey(key);const token=String(fd.get('accessToken')||'').trim();if(token)ENGINE.setAccessToken(token);save();render();toast('Conexión configurada (los secretos no se guardan).')}
 else if(form.id==='wellness-form'){const date=String(fd.get('date'));if(!ENGINE.checkDate(date))return toast('Fecha inválida',true);const numeric=n=>Math.max(0,Math.min(10,Number(fd.get(n))||0));const record={date,sleepHours:Math.max(0,Math.min(16,Number(fd.get('sleepHours'))||0)),energy:numeric('energy'),fatigue:numeric('fatigue'),soreness:numeric('soreness'),pain:numeric('pain'),notes:String(fd.get('notes')||'').slice(0,600)};state.wellness=state.wellness.filter(w=>w.date!==date);state.wellness.push(record);state.wellness.sort((a,b)=>a.date.localeCompare(b.date));save();render();toast('Estado diario guardado')}
 else if(form.id==='profile-form'){const s=Object.fromEntries(fd);state.profile={name:String(s.name||'Mi perfil').trim(),position:String(s.position||'Jugador').trim(),weight:safeNum(s.weight),squat:safeNum(s.squat),bench:safeNum(s.bench),deadlift:safeNum(s.deadlift),goalBench:safeNum(s.goalBench)};save();render();toast('Perfil guardado')}
 else if(form.id==='manual-event-form'){const date=String(fd.get('date')||'');if(!ENGINE.checkDate(date)||date<plan().start||date>plan().end)return toast('El evento debe estar dentro de la semana seleccionada.',true);const kind=String(fd.get('kind')||'rugby');if(!['rugby','match','rest'].includes(kind))return toast('Tipo de evento no permitido',true);const item={id:dId(),date,kind,manual:true,objective:String(fd.get('objective')||'Cambio manual').slice(0,240),activities:[]};const start=String(fd.get('start')||'');if(/^\d\d:\d\d$/.test(start))item.start=start;const minutes=Number(fd.get('minutes'));if(minutes>0&&minutes<=360)item.minutes=minutes;plan().sessions.push(item);save();render();toast('Evento añadido')}
 else if(form.id==='assign-form'){const id=String(fd.get('session')),date=String(fd.get('date'));if(!/^\d{4}-\d{2}-\d{2}$/.test(date))return toast('Selecciona una fecha',true);state.assignments[id]=date;save();render();toast('Sesión de gimnasio asignada')}
 else if(form.id==='exercise-form'){const e=currentDay().exercises.find(x=>x.id===fd.get('id'));if(!e)return;const old=e.repsByPhase||Array(4).fill(e.reps);e.name=String(fd.get('name')||e.name).trim();e.sets=Math.max(0,Math.min(15,Number(fd.get('sets'))||0));e.repsByPhase=old.map((x,i)=>String(fd.get('rep'+i)||x).trim());e.notes=String(fd.get('notes')||'');save();ui.editor=null;render();toast('Prescripción editada localmente')}
 else if(form.id==='workout-form'){const date=String(fd.get('date')),rpe=fd.get('rpe')===''?null:Number(fd.get('rpe'));const day=currentDay();const draft=state.drafts[day.id]||{};const sets=[];for(const e of day.exercises){for(let i=0;i<(Number(e.sets)||0);i++){const r=draft[`${e.id}--${i}`]||{};if(!r.done)continue;sets.push({exercise:e.name,exerciseId:e.id,number:i+1,kg:r.kg===''?null:safeNum(r.kg),reps:r.reps||String(phaseReps(e)||''),prescribed:String(phaseReps(e)||''),rir:phaseRir(e)})}}if(sets.length===0&&day.type!=='recovery'){toast('Marca al menos una serie completada antes de guardar.',true);return;}state.workouts.push({id:dId(),date,dayId:day.id,dayTitle:day.title+' · '+day.subtitle,phase:state.phase,sets,rpe,notes:String(fd.get('notes')||''),createdAt:new Date().toISOString()});delete state.drafts[day.id];save();render();toast('Entrenamiento guardado')}
 else if(form.classList.contains('rugby-rpe-form')){const date=form.dataset.date,value=Number(fd.get('rpe'));if(!ENGINE.checkDate(date)||!Number.isFinite(value)||value<0||value>10)return toast('Esfuerzo inválido: introduce 0–10',true);state.rugbyRpe??={};state.rugbyRpe[date]=value;save();render();toast('Esfuerzo real guardado')}
 else if(form.id==='weekly-import-form'){const review=ui.importReview;if(!review)return;const week=Number(fd.get('week'))||null;const start=String(fd.get('start'));const sessions=[];for(let i=0;i<7;i++){const kind=String(fd.get('kind'+i)),date=plusDays(start,i);if(kind==='none')continue;const activities=String(fd.get('activities'+i)||'').split(/\r?\n/).map(line=>line.trim()).filter(Boolean).map(line=>{const m=line.match(/^([A-Z]{2})\s*:\s*(.*)/);return m?{code:m[1],name:m[2]}:{code:'',name:line}});const s={date,kind,objective:String(fd.get('objective'+i)||''),activities};const c=ENGINE.normalizeColor(fd.get('color'+i));if(c&&['rugby','match'].includes(kind)){s.officialIntensity=c;s.intensitySource='reviewed-pdf'}const previous=review.data.sessions.find(x=>x.date===date&&x.kind===kind);if(previous?.blocks?.length&&JSON.stringify(previous.activities?.map(a=>a.name))===JSON.stringify(activities.map(a=>a.name)))s.blocks=clone(previous.blocks);const time=String(fd.get('time'+i)||'');const minutes=Number(fd.get('minutes'+i));if(time)s.start=time;if(minutes>0)s.minutes=minutes;sessions.push(s)}const obj={start,end:plusDays(start,6),week,season:review.data.season||'',source:review.file,sessions,notes:'Importado y revisado manualmente'};state.plans=state.plans.filter(p=>p.start!==start);state.plans.push(obj);state.plans.sort((a,b)=>a.start.localeCompare(b.start));state.docs.push({id:dId(),name:review.file,type:'weekly',date:dateIso(new Date()),status:'Revisado y confirmado'});ui.planStart=start;ui.selectedDate=start;ui.importReview=null;ui.page='calendar';save();render();toast('Planificación semanal guardada')}
});
function download(name,contents,mime){const blob=new Blob([contents],{type:mime}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000)}
function exportCsv(){const header=['Fecha','Sesión','Bloque','Ejercicio','Serie','Peso kg','Repeticiones','RIR prescrito','Esfuerzo sesión','Observaciones'];const quote=v=>'"'+String(v??'').replace(/"/g,'""')+'"';const rows=state.workouts.flatMap(w=>w.sets.length?w.sets.map(s=>[w.date,w.dayTitle,(w.phase??0)+1,s.exercise,s.number,s.kg,s.reps,s.rir,w.rpe,w.notes]):[[w.date,w.dayTitle,(w.phase??0)+1,'', '', '', '', '',w.rpe,w.notes]]);download('car-performance-series-'+dateIso(new Date())+'.csv','\uFEFF'+[header,...rows].map(r=>r.map(quote).join(';')).join('\r\n'),'text/csv;charset=utf-8')}
async function restore(file){try{const obj=JSON.parse(await file.text());if(obj?.schema!==1||!Array.isArray(obj.plans)||!Array.isArray(obj.workouts)||!obj.gym?.days)throw Error('Formato de copia incompatible');if(!confirm('Esto sustituirá los datos locales actuales. ¿Restaurar?'))return;state=obj;state.wellness??=[];state.rugbyRpe??={};state.aiSettings??={mode:'personal',endpoint:''};state.aiLog??=[];state.gymArchives??=[];ui.planStart=state.plans.at(-1).start;ui.gymDay=state.gym.days[1]?.id||state.gym.days[0].id;ui.page='home';save();render();toast('Copia restaurada')}catch(e){toast('Copia no válida: '+e.message,true)}}
// -------------------------------------------------------------------
// Importación de PDF. Se extraen textos y coordenadas; toda importación
// exige verificación explícita. PDF.js se carga sólo bajo demanda.
// -------------------------------------------------------------------
let pdfLoader=null;
function loadPdfJs(){if(window.pdfjsLib)return Promise.resolve(window.pdfjsLib);if(pdfLoader)return pdfLoader;pdfLoader=new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';s.crossOrigin='anonymous';s.onload=()=>{if(!window.pdfjsLib)return rej(Error('Biblioteca PDF no disponible'));window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';res(window.pdfjsLib)};s.onerror=()=>rej(Error('No se pudo cargar la biblioteca PDF.js: comprueba internet'));document.head.appendChild(s)}).catch(e=>{pdfLoader=null;throw e});return pdfLoader}
async function readPdf(file){const pdfjs=await loadPdfJs();const data=await file.arrayBuffer();const doc=await pdfjs.getDocument({data}).promise;const pages=[],limit=Math.min(doc.numPages,15);for(let n=1;n<=limit;n++){const page=await doc.getPage(n),content=await page.getTextContent();const items=content.items.map(i=>({text:(i.str||'').trim(),x:i.transform?.[4]||0,y:i.transform?.[5]||0})).filter(i=>i.text);pages.push({width:page.view[2]-page.view[0],items,text:items.map(i=>i.text).join(' ')})}return {pages,text:pages.map(p=>p.text).join(' '),totalPages:doc.numPages}}
function findDayLines(items,minX,maxX){const found=items.filter(i=>i.x>=minX&&i.x<=maxX).sort((a,b)=>b.y-a.y||a.x-b.x);const lines=[];for(const i of found){let line=lines.find(l=>Math.abs(l.y-i.y)<3.7);if(!line){line={y:i.y,items:[]};lines.push(line)}line.items.push(i)}return lines.sort((a,b)=>b.y-a.y).map(l=>l.items.sort((a,b)=>a.x-b.x).map(x=>x.text).join(' ').replace(/\s+/g,' ').trim())}
function parseWeekly(pdf,filename){const t=pdf.text.replace(/\s+/g,' '),match=t.match(/Semana\s+del\s+(\d{1,2})\s*\/\s*(\d{1,2})\s+al\s+(\d{1,2})\s*\/\s*(\d{1,2})/i);const w=t.match(/(?:microciclo\s*[-–]?\s*)?semana\s*n[º°o]?\s*(\d{1,2})/i),season=t.match(/(?:temporada)\s*(20\d{2})\s*[\/\-]\s*(\d{2,4})/i);let start=plan().start;
 if(match){const month=Number(match[2]),year=season?Number(season[1])+(month<=7?1:0):new Date().getFullYear();start=`${year}-${pad(month)}-${pad(Number(match[1]))}`}const week=w?Number(w[1]):null;
 const same=(week===12&&start==='2026-11-09'&&/malcolm/i.test(t)&&/touche/i.test(t)&&/ruck/i.test(t));if(same)return {known:true,data:{...clone(CAR_SEED.weekly),source:filename}};
 const p=pdf.pages[0],width=p?.width||841;
 const regions=[{day:0,min:.16,max:.37},{day:1,min:.435,max:.65},{day:3,min:.71,max:.925}],sessions=[];
 for(const reg of regions){let obj='',acts=[];if(p){const lines=findDayLines(p.items,reg.min*width,reg.max*width);const clean=lines.filter(x=>x&&!/^(objetivos|horarios|tiempo total|tipo de intensidad|entrenadores)$/i.test(x));const i=clean.findIndex(s=>/\b(?:AF|CO|DE|TC)\s*:/i.test(s));const candidates=clean.slice(0,i<0?6:i).filter(s=>!/^\d+[\d:]*$/.test(s)&&!/^lunes|martes|jueves$/i.test(s));obj=candidates.join(' ').replace(/\bobjetivos\b/ig,'').trim().slice(0,240);const joined=clean.join(' / ');const pattern=/\b(AF|CO|DE|TC)\s*:\s*([^/]{2,75})/g;for(const m of joined.matchAll(pattern)){acts.push({code:m[1],name:m[2].replace(/\s+/g,' ').trim().slice(0,90)})}}
 // No inventar horarios en otros PDFs: el usuario completa la previsualización.
 if(obj||acts.length)sessions.push({date:plusDays(start,reg.day),kind:'rugby',objective:obj,activities:acts});}
 if(/S[aÁ]BADO\s+DOMINGO/i.test(t)&&/DESCANSO\s+DESCANSO/i.test(t)){sessions.push({date:plusDays(start,5),kind:'rest',objective:'Descanso de equipo',activities:[]},{date:plusDays(start,6),kind:'rest',objective:'Descanso de equipo',activities:[]})}
 return {known:false,data:{start,end:plusDays(start,6),week,season:season?`${season[1]}/${season[2]}`:'',source:filename,sessions}}}
async function importPdf(file,type){if(file.size>18*1024*1024)return toast('PDF demasiado grande (máximo 18 MB)',true);if(!file.name.toLowerCase().endsWith('.pdf'))return toast('Selecciona un archivo PDF',true);ui.fileToAnalyze=file;toast('Analizando el PDF en tu dispositivo…');try{const pdf=await readPdf(file);if(!pdf.text||pdf.text.length<60)throw Error('PDF escaneado o sin texto disponible');if(type==='weekly'){const parsed=parseWeekly(pdf,file.name);ui.importReview={type,file:file.name,...parsed};}else{const t=pdf.text.toUpperCase();const known=['ISO SQUAT VS RACK','BACK SQUAT','PRESS BANCA','PUSH JERK'].every(s=>t.includes(s));ui.importReview={type:'gym',file:file.name,known};}render()}catch(e){if(type==='weekly'){ui.importReview={type,file:file.name,known:false,data:{start:plan().start,end:plan().end,week:null,season:'',sessions:[]},aiWarnings:['Extracción local no disponible: '+e.message+'. Puedes revisar manualmente o utilizar Gemini.']}}else{ui.importReview={type,file:file.name,known:false,aiWarnings:['Extracción local incompleta: '+e.message+'. Puedes extraer con Gemini o registrar para revisión.']}}render();toast('El PDF puede analizarse con Gemini o revisarse manualmente.',true)}}
