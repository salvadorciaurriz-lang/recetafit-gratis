document.addEventListener('submit',ev=>{const form=ev.target;if(!form.id&&!form.classList.contains('rugby-rpe-form'))return;ev.preventDefault();const fd=new FormData(form);
 if(form.id==='ai-settings-form'){const mode=String(fd.get('mode'));state.aiSettings={mode:mode==='proxy'?'proxy':'personal',endpoint:String(fd.get('endpoint')||'').trim()};const key=String(fd.get('apiKey')||'').trim();if(key)ENGINE.setKey(key);const token=String(fd.get('accessToken')||'').trim();if(token)ENGINE.setAccessToken(token);save();render();toast('Conexión configurada (los secretos no se guardan).')}
 else if(form.id==='wellness-form'){const date=String(fd.get('date'));if(!ENGINE.checkDate(date))return toast('Fecha inválida',true);const numeric=n=>Math.max(0,Math.min(10,Number(fd.get(n))||0));const record={date,sleepHours:Math.max(0,Math.min(16,Number(fd.get('sleepHours'))||0)),energy:numeric('energy'),fatigue:numeric('fatigue'),soreness:numeric('soreness'),pain:numeric('pain'),notes:String(fd.get('notes')||'').slice(0,600)};state.wellness=state.wellness.filter(w=>w.date!==date);state.wellness.push(record);state.wellness.sort((a,b)=>a.date.localeCompare(b.date));save();render();toast('Estado diario guardado')}
 else if(form.id==='profile-form'){const s=Object.fromEntries(fd);state.profile={name:String(s.name||'Mi perfil').trim(),position:String(s.position||'Jugador').trim(),weight:safeNum(s.weight),squat:safeNum(s.squat),bench:safeNum(s.bench),deadlift:safeNum(s.deadlift),goalBench:safeNum(s.goalBench)};save();render();toast('Perfil guardado')}
 else if(form.id==='manual-event-form'){const date=String(fd.get('date')||'');if(!ENGINE.checkDate(date)||date<plan().start||date>plan().end)return toast('El evento debe estar dentro de la semana seleccionada.',true);const kind=String(fd.get('kind')||'rugby');if(!['rugby','match','rest'].includes(kind))return toast('Tipo de evento no permitido',true);const item={id:dId(),date,kind,manual:true,objective:String(fd.get('objective')||'Cambio manual').slice(0,240),activities:[]};const start=String(fd.get('start')||'');if(/^\d\d:\d\d$/.test(start))item.start=start;const minutes=Number(fd.get('minutes'));if(minutes>0&&minutes<=360)item.minutes=minutes;plan().sessions.push(item);save();render();toast('Evento añadido')}
 else if(form.id==='assign-form'){const id=String(fd.get('session')),date=String(fd.get('date'));if(!/^\d{4}-\d{2}-\d{2}$/.test(date))return toast('Selecciona una fecha',true);state.assignments[id]=date;save();render();toast('Sesión de gimnasio asignada')}
 else if(form.id==='exercise-form'){const e=currentDay().exercises.find(x=>x.id===fd.get('id'));if(!e)return;const old=e.repsByPhase||Array(4).fill(e.reps);e.name=String(fd.get('name')||e.name).trim();e.sets=Math.max(0,Math.min(15,Number(fd.get('sets'))||0));e.repsByPhase=old.map((x,i)=>String(fd.get('rep'+i)||x).trim());e.notes=String(fd.get('notes')||'');save();ui.editor=null;render();toast('Prescripción editada localmente')}
 else if(form.id==='workout-form'){const date=String(fd.get('date')),rpe=fd.get('rpe')===''?null:Number(fd.get('rpe'));const day=currentDay();const draft=state.drafts[day.id]||{};const sets=[];for(const e of day.exercises){for(let i=0;i<(Number(e.sets)||0);i++){const r=draft[`${e.id}--${i}`]||{};if(!r.done)continue;sets.push({exercise:e.name,exerciseId:e.id,number:i+1,kg:r.kg===''?null:safeNum(r.kg),reps:r.reps||String(phaseReps(e)||''),prescribed:String(phaseReps(e)||''),rir:phaseRir(e)})}}if(sets.length===0&&day.type!=='recovery'){toast('Marca al menos una serie completada antes de guardar.',true);return;}state.workouts.push({id:dId(),date,dayId:day.id,dayTitle:day.title+' · '+day.subtitle,phase:state.phase,sets,rpe,notes:String(fd.get('notes')||''),createdAt:new Date().toISOString()});delete state.drafts[day.id];save();render();toast('Entrenamiento guardado')}
 else if(form.classList.contains('rugby-rpe-form')){const date=form.dataset.date,value=Number(fd.get('rpe'));if(!ENGINE.checkDate(date)||!Number.isFinite(value)||value<0||value>10)return toast('Esfuerzo inválido: introduce 0–10',true);state.rugbyRpe??={};state.rugbyRpe[date]=value;save();render();toast('Esfuerzo real guardado')}
 else if(form.id==='weekly-import-form'){const review=ui.importReview;if(!review)return;const week=Number(fd.get('week'))||null;const start=String(fd.get('start'));const sessions=[];for(let i=0;i<7;i++){const kind=String(fd.get('kind'+i)),date=plusDays(start,i);if(kind==='none')continue;const activities=String(fd.get('activities'+i)||'').split(/\r?\n/).map(line=>line.trim()).filter(Boolean).map(line=>{const m=line.match(/^([A-Z]{2})\s*:\s*(.*)/);return m?{code:m[1],name:m[2]}:{code:'',name:line}});const s={date,kind,objective:String(fd.get('objective'+i)||''),activities};const c=ENGINE.normalizeColor(fd.get('color'+i));if(c&&['rugby','match'].includes(kind)){s.officialIntensity=c;s.intensitySource='reviewed-pdf'}const previous=review.data.sessions.find(x=>x.date===date&&x.kind===kind);if(previous?.blocks?.length&&JSON.stringify(previous.activities?.map(a=>a.name))===JSON.stringify(activities.map(a=>a.name)))s.blocks=clone(previous.blocks);const time=String(fd.get('time'+i)||'');const minutes=Number(fd.get('minutes'+i));if(time)s.start=time;if(minutes>0)s.minutes=minutes;sessions.push(s)}const obj={start,end:plusDays(start,6),week,season:review.data.season||'',source:review.file,sessions,notes:'Importado y revisado manualmente'};state.plans=state.plans.filter(p=>p.start!==start);state.plans.push(obj);state.plans.sort((a,b)=>a.start.localeCompare(b.start));state.docs.push({id:dId(),name:review.file,type:'weekly',date:dateIso(new Date()),status:'Revisado y confirmado'});ui.planStart=start;ui.selectedDate=start;ui.importReview=null;ui.page='calendar';save();render();toast('Planificación semanal guardada')}

function download(name,contents,mime){const blob=new Blob([contents],{type:mime}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000)}
function exportCsv(){const header=['Fecha','Sesión','Bloque','Ejercicio','Serie','Peso kg','Repeticiones','RIR prescrito','Esfuerzo sesión','Observaciones'];const quote=v=>'"'+String(v??'').replace(/"/g,'""')+'"';const rows=state.workouts.flatMap(w=>w.sets.length?w.sets.map(s=>[w.date,w.dayTitle,(w.phase??0)+1,s.exercise,s.number,s.kg,s.reps,s.rir,w.rpe,w.notes]):[[w.date,w.dayTitle,(w.phase??0)+1,'', '', '', '', '',w.rpe,w.notes]]);download('car-performance-series-'+dateIso(new Date())+'.csv','\uFEFF'+[header,...rows].map(r=>r.map(quote).join(';')).join('\r\n'),'text/csv;charset=utf-8')}
async function restore(file){try{const obj=JSON.parse(await file.text());if(obj?.schema!==1||!Array.isArray(obj.plans)||!Array.isArray(obj.workouts)||!obj.gym?.days)throw Error('Formato de copia incompatible');if(!confirm('Esto sustituirá los datos locales actuales. ¿Restaurar?'))return;state=obj;state.wellness??=[];state.rugbyRpe??={};state.aiSettings??={mode:'personal',endpoint:''};state.aiLog??=[];state.gymArchives??=[];ui.planStart=state.plans.at(-1).start;ui.gymDay=state.gym.days[1]?.id||state.gym.days[0].id;ui.page='home';save();render();toast('Copia restaurada')}catch(e){toast('Copia no válida: '+e.message,true)}}
// -------------------------------------------------------------------
// Importación de PDF. Se extraen textos y coordenadas; toda importación
// exige verificación explícita. PDF.js se carga sólo bajo demanda.
// -------------------------------------------------------------------
let pdfLoader=null;
function loadPdfJs(){if(window.pdfjsLib)return Promise.resolve(window.pdfjsLib);if(pdfLoader)return pdfLoader;pdfLoader=new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';s.crossOrigin='anonymous';s.onload=()=>{if(!window.pdfjsLib)return rej(Error('Biblioteca PDF no disponible'));window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';res(window.pdfjsLib)};s.onerror=()=>rej(Error('No se pudo cargar la biblioteca PDF.js: comprueba internet'));document.head.appendChild(s)}).catch(e=>{pdfLoader=null;throw e});return pdfLoader}
async function readPdf(file){const pdfjs=await loadPdfJs();const data=await file.arrayBuffer();const doc=await pdfjs.getDocument({data}).promise;const pages=[],limit=Math.min(doc.numPages,15);for(let n=1;n<=limit;n++){const page=await doc.getPage(n),content=await page.getTextContent();const items=content.items.map(i=>({text:(i.str||'').trim(),x:i.transform?.[4]||0,y:i.transform?.[5]||0})).filter(i=>i.text);pages.push({width:page.view[2]-page.view[0],items,text:items.map(i=>i.text).join(' ')})}return {pages,text:pages.map(p=>p.text).join(' '),totalPages:doc.numPages}}
function findDayLines(items,minX,maxX){const found=items.filter(i=>i.x>=minX&&i.x<=maxX).sort((a,b)=>b.y-a.y||a.x-b.x);const lines=[];for(const i of found){let line=lines.find(l=>Math.abs(l.y-i.y)<3.7);if(!line){line={y:i.y,items:[]};lines.push(line)}line.items.push(i)}return lines.sort((a,b)=>b.y-a.y).map(l=>l.items.sort((a,b)=>a.x-b.x).map(x=>x.text).join(' ').replace(/\s+/g,' ').trim())}
function parseWeekly(pdf,filename){const t=pdf.text.replace(/\s+/g,' '),match=t.match(/Semana\s+del\s+(\d{1,2})\s*\/\s*(\d{1,2})\s+al\s+(\d{1,2})\s*\/\s*(\d{1,2})/i);const w=t.match(/(?:microciclo\s*[-–]?\s*)?semana\s*n[º°o]?\s*(\d{1,2})/i),season=t.match(/(?:temporada)\s*(20\d{2})\s*[\/\-]\s*(\d{2,4})/i);let start=plan().start;
 if(match){const month=Number(match[2]),year=season?Number(season[1])+(month<=7?1:0):new Date().getFullYear();start=`${year}-${pad(month)}-${pad(Number(match[1]))}`}const week=w?Number(w[1]):null;
 const same=(week===12&&start==='2026-11-09'&&/malcolm/i.test(t)&&/touche/i.test(t)&&/ruck/i.test(t));if(same)return {known:true,data:{...clone(CAR_SEED.weekly),source:filename}};
 const p=pdf.pages[0],width=p?.width||841;
 const regions=[{day:0,min:.16,max:.37},{day:1,min:.435,max:.65},{day:3,min:.71,max:.925}],sessions=[];
 for(const reg of regions){let obj='',acts=[];if(p){const lines=findDayLines(p.items,reg.min*width,reg.max*width);const clean=lines.filter(x=>x&&!/^(objetivos|horarios|tiempo total|tipo de intensidad|entrenadores)$/i.test(x));const i=clean.findIndex(s=>/\b(?:AF|CO|DE|TC)\s*:/i.test(s));const candidates=clean.slice(0,i<0?6:i).filter(s=>!/^\d+[\d:]*$/.test(s)&&!/^lunes|martes|jueves$/i.test(s));obj=candidates.join(' ').replace(/\bobjetivos\b/ig,'').trim().slice(0,240);const joined=clean.join(' / ');const pattern=/\b(AF|CO|DE|TC)\s*:\s*([^/]{2,75})/g;for(const m of joined.matchAll(pattern)){acts.push({code:m[1],name:m[2].replace(/\s+/g,' ').trim().slice(0,90)})}}
 // No inventar horarios en otros PDFs: el usuario completa la previsualización.
 if(obj||acts.length)sessions.push({date:plusDays(start,reg.day),kind:'rugby',objective:obj,activities:acts});}
 if(/S[aÁ]BADO\s+DOMINGO/i.test(t)&&/DESCANSO\s+DESCANSO/i.test(t)){sessions.push({date:plusDays(start,5),kind:'rest',objective:'Descanso de equipo',activities:[]},{date:plusDays(start,6),kind:'rest',objective:'Descanso de equipo',activities:[]})}
 return {known:false,data:{start,end:plusDays(start,6),week,season:season?`${season[1]}/${season[2]}`:'',source:filename,sessions}}}
async function importPdf(file,type){if(file.size>18*1024*1024)return toast('PDF demasiado grande (máximo 18 MB)',true);if(!file.name.toLowerCase().endsWith('.pdf'))return toast('Selecciona un archivo PDF',true);ui.fileToAnalyze=file;toast('Analizando el PDF en tu dispositivo…');try{const pdf=await readPdf(file);if(!pdf.text||pdf.text.length<60)throw Error('PDF escaneado o sin texto disponible');if(type==='weekly'){const parsed=parseWeekly(pdf,file.name);ui.importReview={type,file:file.name,...parsed};}else{const t=pdf.text.toUpperCase();const known=['ISO SQUAT VS RACK','BACK SQUAT','PRESS BANCA','PUSH JERK'].every(s=>t.includes(s));ui.importReview={type:'gym',file:file.name,known};}render()}catch(e){if(type==='weekly'){ui.importReview={type,file:file.name,known:false,data:{start:plan().start,end:plan().end,week:null,season:'',sessions:[]},aiWarnings:['Extracción local no disponible: '+e.message+'. Puedes revisar manualmente o utilizar Gemini.']}}else{ui.importReview={type,file:file.name,known:false,aiWarnings:['Extracción local incompleta: '+e.message+'. Puedes extraer con Gemini o registrar para revisión.']}}render();toast('El PDF puede analizarse con Gemini o revisarse manualmente.',true)}}
render();
