ilter(w=>w.dayId===d.id).slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5).map(w=>`<div class="item-row"><div><strong>${esc(fDate(w.date))}</strong><div class="meta">${w.sets.length} series · RPE ${esc(w.rpe??'—')}</div></div>${badge('Guardada')}</div>`).join('')||'<p class="muted small">Aún no has registrado este entrenamiento.</p>'}</div><div class="notice">La IA todavía no modifica automáticamente cargas ni prescribe readaptación. Esta primera versión registra y compara lo realmente ejecutado.</div></div></div>`}
function progress(){const all=state.workouts.slice().sort((a,b)=>b.date.localeCompare(a.date));const sets=all.flatMap(w=>w.sets.map(s=>({...s,date:w.date})));const weighted=sets.filter(s=>Number(s.kg)>0);const best={};for(const s of weighted){if(!best[s.exercise]||Number(s.kg)>Number(best[s.exercise].kg))best[s.exercise]=s;}const ranked=Object.values(best).sort((a,b)=>b.kg-a.kg).slice(0,8);const v=all.reduce((n,w)=>n+volume(w),0);const sleep=state.wellness.slice(-7).map(w=>Number(w.sleepHours)||0);const avgSleep=sleep.length?(sleep.reduce((a,b)=>a+b,0)/sleep.length).toFixed(1):null;const rankPoints=all.length*50+sets.length*5+state.wellness.length*10;const personalRank=rankPoints<250?'Inicial':rankPoints<750?'Constante':rankPoints<1500?'Avanzando':'Veterano';const benchSets=sets.filter(x=>/press banca/i.test(x.exercise)&&Number(x.kg)>0&&Number(x.reps)>0&&Number(x.reps)<=12);const estimated=benchSets.length?Math.max(...benchSets.map(s=>Math.round(Number(s.kg)*(1+Number(s.reps)/30)*10)/10)):null;const timeline=state.wellness.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,7).reverse();return `${heading('Progreso','Marcas reales, volumen registrado y adherencia a las sesiones.')}
<div class="grid4 mb"><div class="card kpi"><div class="kpi-label">Rango personal</div><div class="kpi-value" style="font-size:1.4rem">${esc(personalRank)}</div><div class="kpi-foot">${rankPoints} puntos por constancia</div></div><div class="card kpi"><div class="kpi-label">Sueño medio (7 registros)</div><div class="kpi-value">${esc(avgSleep??'—')} ${avgSleep?'h':''}</div><div class="kpi-foot">Autodeclarado</div></div><div class="card kpi"><div class="kpi-label">1RM press banca estimado</div><div class="kpi-value">${esc(estimated??'—')}</div><div class="kpi-foot">Epley; solo series de 1–12 reps</div></div><div class="card kpi"><div class="kpi-label">Registros recuperación</div><div class="kpi-value">${state.wellness.length}</div><div class="kpi-foot">Estado y fatiga</div></div></div><div class="card mb"><div class="card-head"><h2>Evolución de energía y fatiga</h2>${badge('Últimos 7 registros','gray')}</div>${timeline.length?timeline.map(w=>`<div class="metric-row"><span>${esc(fDate(w.date))}</span><div class="metric-track"><span class="metric-energy" style="width:${Math.min(100,Number(w.energy)*10)}%"></span></div><div class="metric-track"><span class="metric-fatigue" style="width:${Math.min(100,Number(w.fatigue)*10)}%"></span></div><span>${esc(w.energy)}/${esc(w.fatigue)}</span></div>`).join(''):'<p class="muted small">Registra tu estado en Entrenador IA para ver tendencias.</p>'}<p class="fineprint">Barra verde = energía; barra roja = fatiga. Datos autodeclarados, sin diagnóstico.</p></div>
<div class="grid4 mb"><div class="card kpi"><div class="kpi-label">Sesiones registradas</div><div class="kpi-value">${all.length}</div><div class="kpi-foot">Gimnasio</div></div><div class="card kpi"><div class="kpi-label">Series registradas</div><div class="kpi-value">${sets.length}</div><div class="kpi-foot">Series completadas</div></div><div class="card kpi"><div class="kpi-label">Volumen registrado</div><div class="kpi-value">${Math.round(v).toLocaleString('es-ES')}</div><div class="kpi-foot">kg × repeticiones numéricas</div></div><div class="card kpi"><div class="kpi-label">Ejercicios con carga</div><div class="kpi-value">${Object.keys(best).length}</div><div class="kpi-foot">Máximos registrados</div></div></div>
<div class="grid2"><div class="card"><div class="card-head"><h2>Mejores cargas registradas</h2>${badge('Histórico','gray')}</div>${ranked.length?ranked.map(s=>`<div class="item-row"><div><strong>${esc(s.exercise)}</strong><div class="meta">${esc(fDate(s.date))} · ${esc(s.reps||'—')} repeticiones</div></div><strong>${esc(s.kg)} kg</strong></div>`).join(''):'<p class="muted">No existen aún series con pesos registrados. Comienza por el apartado Gimnasio.</p>'}<p class="fineprint">Son las cargas máximas introducidas por ejercicio, no estimaciones de 1RM.</p></div><div class="card"><div class="card-head"><h2>Últimas sesiones</h2><button class="btn small" data-action="export-csv">Exportar CSV</button></div>${all.length?all.slice(0,12).map(w=>`<div class="history-item"><span class="muted small">${esc(fDate(w.date))}</span><div><strong>${esc(w.dayTitle)}</strong><div class="meta">${w.sets.length} series · RPE ${esc(w.rpe??'—')} · ${Math.round(volume(w))} kg</div></div><button class="btn small red" data-action="delete-workout" data-id="${esc(w.id)}">Borrar</button></div>`).join(''):'<p class="muted">Aún no hay entrenamientos guardados.</p>'}</div></div>`}

 ${i.proposed.length?i.proposed.map(p=>`<div class="item-row"><div><strong>${esc(p.title)}</strong><div class="meta">${esc(fDate(p.date,'long'))} · ${esc(p.reason)}</div></div><button class="btn small" data-action="assign-proposed" data-id="${esc(p.id)}" data-date="${p.date}">Asignar</button></div>`).join(''):'<p class="muted">No hay huecos suficientes para proponer sesiones adicionales sin conflictos.</p>'}
 ${i.excluded.map(x=>`<div class="fineprint">${esc(x)}</div>`).join('')}

 <p class="fineprint">Los días sin sesión indicada no son necesariamente días de descanso. Verifica la planificación con tus técnicos.</p></div></div>
 <div class="stack"><div class="card"><div class="card-head"><h2>Google Gemini</h2>${badge(ENGINE.hasKey()||state.aiSettings.mode==='proxy'?'Configurable':'Sin conectar','gray')}</div>
 <p class="muted small">Usamos la API Gemini, como en tus otras aplicaciones. Para preservar tu clave, no la incluimos en la web pública ni la guardamos. La IA es opcional.</p>
 <form id="ai-settings-form" class="stack"><div class="field"><label>Forma de conexión</label><select name="mode" class="select" id="ai-mode"><option value="personal" ${state.aiSettings.mode!=='proxy'?'selected':''}>Clave personal temporal (solo uso propio)</option><option value="proxy" ${state.aiSettings.mode==='proxy'?'selected':''}>Servidor seguro (recomendado para compartir)</option></select></div><div class="field"><label>Clave de Google AI Studio (solo sesión actual)</label><input class="input" type="password" name="apiKey" autocomplete="off" placeholder="${ENGINE.hasKey()?'Clave introducida en esta sesión':'Pega aquí tu clave personal'}"></div><div class="field"><label>Token de acceso del servidor (solo esta sesión)</label><input class="input" type="password" name="accessToken" autocomplete="off" placeholder="Token del servidor, si está configurado"></div><div class="field"><label>URL HTTPS del servidor seguro (opcional)</label><input class="input" type="url" name="endpoint" placeholder="https://tu-dominio.com/api/gemini" value="${attr(state.aiSettings.endpoint||'')}"></div><button class="btn" type="submit">Configurar IA</button></form><div class="actions" style="margin-top:8px"><button class="btn small red" data-action="clear-ai-key">Olvidar clave de esta sesión</button></div><p class="fineprint">El modo con clave personal envía las peticiones directamente a Google. No lo compartas con compañeros con tu clave incluida. Para uso colectivo se necesita un servidor con la clave en un secreto protegido. Consulta el archivo README.</p></div>

function download(name,contents,mime){const blob=new Blob([contents],{type:mime}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000)}
function exportCsv(){const header=['Fecha','Sesión','Bloque','Ejercicio','Serie','Peso kg','Repeticiones','RIR prescrito','Esfuerzo sesión','Observaciones'];const quote=v=>'"'+String(v??'').replace(/"/g,'""')+'"';const rows=state.workouts.flatMap(w=>w.sets.length?w.sets.map(s=>[w.date,w.dayTitle,(w.phase??0)+1,s.exercise,s.number,s.kg,s.reps,s.rir,w.rpe,w.notes]):[[w.date,w.dayTitle,(w.phase??0)+1,'', '', '', '', '',w.rpe,w.notes]]);download('car-performance-series-'+dateIso(new Date())+'.csv','\uFEFF'+[header,...rows].map(r=>r.map(quote).join(';')).join('\r\n'),'text/csv;charset=utf-8')}
async function restore(file){try{const obj=JSON.parse(await file.text());if(obj?.schema!==1||!Array.isArray(obj.plans)||!Array.isArray(obj.workouts)||!obj.gym?.days)throw Error('Formato de copia incompatible');if(!confirm('Esto sustituirá los datos locales actuales. ¿Restaurar?'))return;state=obj;state.wellness??=[];state.aiSettings??={mode:'personal',endpoint:''};state.aiLog??=[];state.gymArchives??=[];ui.planStart=state.plans.at(-1).start;ui.gymDay=state.gym.days[1]?.id||state.gym.days[0].id;ui.page='home';save();render();toast('Copia restaurada')}catch(e){toast('Copia no válida: '+e.message,true)}}

let pdfLoader=null;
function loadPdfJs(){if(window.pdfjsLib)return Promise.resolve(window.pdfjsLib);if(pdfLoader)return pdfLoader;pdfLoader=new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';s.crossOrigin='anonymous';s.onload=()=>{if(!window.pdfjsLib)return rej(Error('Biblioteca PDF no disponible'));window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';res(window.pdfjsLib)};s.onerror=()=>rej(Error('No se pudo cargar la biblioteca PDF.js: comprueba internet'));document.head.appendChild(s)}).catch(e=>{pdfLoader=null;throw e});return pdfLoader}
async function readPdf(file){const pdfjs=await loadPdfJs();const data=await file.arrayBuffer();const doc=await pdfjs.getDocument({data}).promise;const pages=[],limit=Math.min(doc.numPages,15);for(let n=1;n<=limit;n++){const page=await doc.getPage(n),content=await page.getTextContent();const items=content.items.map(i=>({text:(i.str||'').trim(),x:i.transform?.[4]||0,y:i.transform?.[5]||0})).filter(i=>i.text);pages.push({width:page.view[2]-page.view[0],items,text:items.map(i=>i.text).join(' ')})}return {pages,text:pages.map(p=>p.text).join(' '),totalPages:doc.numPages}}
function findDayLines(items,minX,maxX){const found=items.filter(i=>i.x>=minX&&i.x<=maxX).sort((a,b)=>b.y-a.y||a.x-b.x);const lines=[];for(const i of found){let line=lines.find(l=>Math.abs(l.y-i.y)<3.7);if(!line){line={y:i.y,items:[]};lines.push(line)}line.items.push(i)}return lines.sort((a,b)=>b.y-a.y).map(l=>l.items.sort((a,b)=>a.x-b.x).map(x=>x.text).join(' ').replace(/\s+/g,' ').trim())}
function parseWeekly(pdf,filename){const t=pdf.text.replace(/\s+/g,' '),match=t.match(/Semana\s+del\s+(\d{1,2})\s*\/\s*(\d{1,2})\s+al\s+(\d{1,2})\s*\/\s*(\d{1,2})/i);const w=t.match(/(?:microciclo\s*[-–]?\s*)?semana\s*n[º°o]?\s*(\d{1,2})/i),season=t.match(/(?:temporada)\s*(20\d{2})\s*[\/\-]\s*(\d{2,4})/i);let start=plan().start;
 if(match){const month=Number(match[2]),year=season?Number(season[1])+(month<=7?1:0):new Date().getFullYear();start=`${year}-${pad(month)}-${pad(Number(match[1]))}`}const week=w?Number(w[1]):null;
 const same=(week===12&&start==='2026-11-09'&&/malcolm/i.test(t)&&/touche/i.test(t)&&/ruck/i.test(t));if(same)return {known:true,data:{...clone(CAR_SEED.weekly),source:filename}};
 const p=pdf.pages[0],width=p?.width||841;
 const regions=[{day:0,min:.16,max:.37},{day:1,min:.435,max:.65},{day:3,min:.71,max:.925}],sessions=[];
 for(const reg of regions){let obj='',acts=[];if(p){const lines=findDayLines(p.items,reg.min*width,reg.max*width);const clean=lines.filter(x=>x&&!/^(objetivos|horarios|tiempo total|tipo de intensidad|entrenadores)$/i.test(x));const i=clean.findIndex(s=>/\b(?:AF|CO|DE|TC)\s*:/i.test(s));const candidates=clean.slice(0,i<0?6:i).filter(s=>!/^\d+[\d:]*$/.test(s)&&!/^lunes|martes|jueves$/i.test(s));obj=candidates.join(' ').replace(/\bobjetivos\b/ig,'').trim().slice(0,240);const joined=clean.join(' / ');const pattern=/\b(AF|CO|DE|TC)\s*:\s*([^/]{2,75})/g;for(const m of joined.matchAll(pattern)){acts.push({code:m[1],name:m[2].replace(/\s+/g,' ').trim().slice(0,90)})}}
 // No inventar horarios en otros PDFs: el usuario completa la previsualización.
 if(obj||acts.length)sessions.push({date:plusDays(start,reg.day),kind:'rugby',objective:obj,activities:acts});}
 if(/S[aÁ]BADO\s+DOMINGO/i.test(t)&&/DESCANSO\s+DESCANSO/i.test(t)){sessions.push({date:plusDays(start,5),kind:'rest',objective:'Descanso de equipo',activities:[]},{date:plusDays(start,6),kind:'rest',objective:'Descanso de equipo',activities:[]})}
 return {known:false,data:{start,end:plusDays(start,6),week,season:season?`${season[1]}/${season[2]}`:'',source:filename,sessions}}}
async function importPdf(file,type){if(file.size>18*1024*1024)return toast('PDF demasiado grande (máximo 18 MB)',true);if(!file.name.toLowerCase().endsWith('.pdf'))return toast('Selecciona un archivo PDF',true);ui.fileToAnalyze=file;toast('Analizando el PDF en tu dispositivo…');try{const pdf=await readPdf(file);if(!pdf.text||pdf.text.length<60)throw Error('PDF escaneado o sin texto disponible');if(type==='weekly'){const parsed=parseWeekly(pdf,file.name);ui.importReview={type,file:file.name,...parsed};}else{const t=pdf.text.toUpperCase();const known=['ISO SQUAT VS RACK','BACK SQUAT','PRESS BANCA','PUSH JERK'].every(s=>t.includes(s));ui.importReview={type:'gym',file:file.name,known};}render()}catch(e){if(type==='weekly'){ui.importReview={type,file:file.name,known:false,data:{start:plan().start,end:plan().end,week:null,season:'',sessions:[]},aiWarnings:['Extracción local no disponible: '+e.message+'. Puedes revisar manualmente o utilizar Gemini.']}}else{ui.importReview={type,file:file.name,known:false,aiWarnings:['Extracción local incompleta: '+e.message+'. Puedes extraer con Gemini o registrar para revisión.']}}render();toast('El PDF puede analizarse con Gemini o revisarse manualmente.',true)}}
render();

})();
